; ============================================================
; PlatformIO configuration – ESP32-S3 + Arduino
; Multi-Sensor System:
;   - Alphasense B43F gas sensor via ADS1115 (I2C 16-bit ADC)
;   - FS4001-500-CV-A flow sensor via RS232 (UART)
; ------------------------------------------------------------
; NOTE: Board settings are based on a typical ESP32-S3 DevKit.
;       Adjust 'board', flash size, partition scheme and USB
;       settings to match your exact hardware revision.
;
; I2C pins (SDA=41, SCL=42) for ADS1115
; UART pins (RX=17, TX=18) for FS4001 flow sensor (RS232)
; Override with -DSDA_PIN=x -DSCL_PIN=y if needed.
; ============================================================

[platformio]
default_envs = esp32s3

; ---- shared options ----------------------------------------
[common]
monitor_speed  = 115200
build_flags    =
    ; -DARDUINO_USB_MODE=1
    ; -DARDUINO_USB_CDC_ON_BOOT=1
    ; ---- Gas Sensor I2C pins (ADS1115)
    -DSDA_PIN=41
    -DSCL_PIN=42
    ; ---- Flow Sensor UART pins (FS4001 RS232)
    -DFLOW_RX_PIN=17
    -DFLOW_TX_PIN=18
    ; ---- Sampling tunables (also overridable in config.h)
    -DSAMPLE_INTERVAL_MS=1000
    -DEMA_ALPHA=0.1f
    -DFLOW_EMA_ALPHA=0.1f

; ---- default environment -----------------------------------
[env:esp32s3]
platform              = espressif32
board                 = esp32-s3-devkitc-1
framework             = arduino

; Serial / monitor
monitor_speed         = ${common.monitor_speed}
monitor_filters       = esp32_exception_decoder, colorize

; Upload
upload_protocol       = esptool

; Board / build
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 8MB
board_build.partitions          = default_8MB.csv
board_build.mcu                 = esp32s3

build_flags = ${common.build_flags}
    ; 链接器内存优化 - 解决"memory exhausted"错误
    -O2                     ; 优化级别2（平衡大小和速度）
    -g0                     ; 不生成调试信息
    -DNDEBUG                ; 禁用断言
    -Wl,-Map=.pio/build/esp32s3/firmware.map
    -Wl,--cref
    -Wl,--gc-sections        ; 删除未使用的段

; ADS1115 16-bit I2C ADC driver for gas sensor
lib_deps =
    adafruit/Adafruit ADS1X15@^2.5.0
    ; 2.4寸 ST7789 SPI LCD (正点原子 DNESP32S3)
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3

; Note: FS4001 flow sensor uses RS232 via UART (HardwareSerial), no additional libraries needed
; Requires RS232-TTL level converter between ESP32 and FS4001 sensor
